<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohsenix — animated profile header</title>
  <desc id="desc">A kinetic neon header with aurora colors, animated waves, glitch typography, and a live command line.</desc>

  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#F472B6;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".5" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#F472B6;#22D3EE;#A78BFA" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#22D3EE;#A78BFA;#F472B6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="cyanBlob">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBlob">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkBlob">
      <stop offset="0" stop-color="#DB2777" stop-opacity=".32"/>
      <stop offset="1" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94A3B8" opacity=".17"/>
    </pattern>

    <linearGradient id="tickerFade">
      <stop offset="0" stop-color="black"/>
      <stop offset=".08" stop-color="white"/>
      <stop offset=".92" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="tickerMask">
      <rect x="30" y="320" width="1140" height="24" fill="url(#tickerFade)"/>
    </mask>

    <clipPath id="commandReveal">
      <rect x="106" y="263" width="0" height="30">
        <animate attributeName="width" from="0" to="505" begin=".75s" dur="2.1s" fill="freeze" calcMode="spline" keySplines=".25 .1 .25 1"/>
      </rect>
    </clipPath>

    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.15  0 1 0 0 0.05  0 0 1 0 0.35  0 0 0 .75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <style>
      .grid {
        animation: gridDrift 18s linear infinite;
      }
      .blob-a {
        animation: blobA 11s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .blob-b {
        animation: blobB 14s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .blob-c {
        animation: blobC 12s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .wave-one {
        stroke-dasharray: 11 14;
        animation: dashForward 9s linear infinite;
      }
      .wave-two {
        stroke-dasharray: 4 18;
        animation: dashBack 11s linear infinite;
      }
      .main-title {
        animation: titleFloat 5s ease-in-out infinite;
        transform-origin: 600px 170px;
      }
      .glitch-cyan, .glitch-pink {
        opacity: 0;
      }
      .glitch-cyan {
        animation: glitchCyan 5.8s steps(1,end) infinite;
      }
      .glitch-pink {
        animation: glitchPink 5.8s steps(1,end) infinite;
      }
      .live-dot {
        animation: livePulse 1.4s ease-in-out infinite;
      }
      .cursor {
        animation: cursorBlink .72s steps(1,end) 2.85s infinite;
        opacity: 0;
      }
      .ticker {
        animation: tickerMove 22s linear infinite;
      }
      .corner {
        animation: cornerPulse 3s ease-in-out infinite;
      }

      @keyframes gridDrift {
        to { transform: translate(30px, 30px); }
      }
      @keyframes blobA {
        from { transform: translate(-50px, -20px) scale(.9); }
        to { transform: translate(120px, 32px) scale(1.22); }
      }
      @keyframes blobB {
        from { transform: translate(85px, 34px) scale(1.15); }
        to { transform: translate(-105px, -28px) scale(.88); }
      }
      @keyframes blobC {
        from { transform: translate(-15px, 42px) scale(.92); }
        to { transform: translate(70px, -35px) scale(1.18); }
      }
      @keyframes dashForward {
        to { stroke-dashoffset: -300; }
      }
      @keyframes dashBack {
        to { stroke-dashoffset: 300; }
      }
      @keyframes titleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes glitchCyan {
        0%, 88%, 92%, 100% { opacity: 0; transform: translate(0,0); }
        89% { opacity: .75; transform: translate(-7px,2px); }
        90% { opacity: .45; transform: translate(4px,-2px); }
        91% { opacity: .7; transform: translate(-2px,1px); }
      }
      @keyframes glitchPink {
        0%, 88%, 92%, 100% { opacity: 0; transform: translate(0,0); }
        89% { opacity: .55; transform: translate(6px,-2px); }
        90% { opacity: .7; transform: translate(-3px,3px); }
        91% { opacity: .4; transform: translate(3px,-1px); }
      }
      @keyframes livePulse {
        0%, 100% { opacity: .35; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes tickerMove {
        to { transform: translateX(-850px); }
      }
      @keyframes cornerPulse {
        0%, 100% { opacity: .25; }
        50% { opacity: .8; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .cursor, .glitch-cyan, .glitch-pink { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#05060A"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" stroke="#30363D" stroke-width="2"/>

  <g filter="url(#softBlur)">
    <ellipse class="blob-a" cx="270" cy="90" rx="240" ry="150" fill="url(#cyanBlob)"/>
    <ellipse class="blob-b" cx="860" cy="130" rx="290" ry="170" fill="url(#violetBlob)"/>
    <ellipse class="blob-c" cx="600" cy="300" rx="250" ry="130" fill="url(#pinkBlob)"/>
  </g>

  <rect class="grid" x="-30" y="-30" width="1260" height="420" fill="url(#dotGrid)"/>

  <path class="wave-one" d="M-40 228C144 144 260 286 433 210C605 135 710 257 872 187C1009 127 1102 183 1240 129" stroke="#22D3EE" stroke-opacity=".25" stroke-width="1.5"/>
  <path class="wave-two" d="M-60 111C99 190 251 78 407 143C584 218 693 91 845 153C1016 222 1118 105 1260 168" stroke="#C084FC" stroke-opacity=".28" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <path class="corner" d="M35 58V35H58" stroke="#22D3EE"/>
    <path class="corner" d="M1142 35H1165V58" stroke="#A78BFA"/>
    <text x="53" y="60" fill="#94A3B8" font-size="11" letter-spacing="2.2">MOHSEN AFSHARPOUR / DIGITAL BUILDER</text>
    <circle class="live-dot" cx="1100" cy="56" r="4" fill="#34D399"/>
    <text x="1112" y="60" fill="#94A3B8" font-size="11" letter-spacing="1.5">LIVE</text>
  </g>

  <g class="main-title" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="6" text-anchor="middle">
    <text x="600" y="203" fill="none" stroke="#F8FAFC" stroke-opacity=".1" stroke-width="2">MOHSENIX</text>
    <text class="glitch-cyan" x="600" y="203" fill="#22D3EE">MOHSENIX</text>
    <text class="glitch-pink" x="600" y="203" fill="#F472B6">MOHSENIX</text>
    <text x="600" y="203" fill="url(#titleGradient)" filter="url(#neon)">MOHSENIX</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="68" y="248" width="1064" height="53" rx="12" fill="#080B12" fill-opacity=".86" stroke="#273244"/>
    <circle cx="89" cy="274.5" r="5" fill="#34D399"/>
    <g clip-path="url(#commandReveal)">
      <text x="106" y="281" fill="#E2E8F0" font-size="17">
        <tspan fill="#7DD3FC">&gt;</tspan>
        <tspan> build(</tspan><tspan fill="#C4B5FD">"ideas"</tspan><tspan>).automate(</tspan><tspan fill="#F9A8D4">"work"</tspan><tspan>).ship();</tspan>
      </text>
    </g>
    <rect class="cursor" x="579" y="262" width="2.5" height="24" fill="#7DD3FC"/>
    <text x="1104" y="280" text-anchor="end" fill="#475569" font-size="11">STATUS 200 / BUILDING</text>
  </g>

  <g mask="url(#tickerMask)">
    <g class="ticker" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2.5" fill="#64748B">
      <text x="45" y="340">VIBE CODING  •  PROMPT ENGINEERING  •  AI AGENTS  •  N8N AUTOMATION  •  IDEAS INTO PRODUCTS  •</text>
      <text x="895" y="340">VIBE CODING  •  PROMPT ENGINEERING  •  AI AGENTS  •  N8N AUTOMATION  •  IDEAS INTO PRODUCTS  •</text>
      <text x="1745" y="340">VIBE CODING  •  PROMPT ENGINEERING  •  AI AGENTS  •  N8N AUTOMATION  •  IDEAS INTO PRODUCTS  •</text>
    </g>
  </g>
</svg>